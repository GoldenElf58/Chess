[project]
name = "Python Chess"
version = "1.0.0"
description = "A desktop chess game with computer opponents"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pygame-ce>=2.5.8,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.21,<7"]
dev = ["mypy", "setuptools"]
