name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: windows-x64
            launcher: "Play Chess.bat"
            build-mode: onedir
          - os: macos-15
            asset: macos-arm64
            launcher: "Play Chess.command"
            build-mode: onefile
          - os: ubuntu-22.04
            asset: linux-x64
            launcher: "Play Chess.sh"
            build-mode: onedir

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller
        run: pyinstaller --noconfirm --${{ matrix.build-mode }} --name Chess main.py
      - name: Assemble downloadable archive
        shell: bash
        run: |
          mkdir -p dist/staging/Chess
          if [[ "${{ matrix.build-mode }}" == "onefile" ]]; then
            cp dist/Chess dist/staging/Chess/Chess
          else
            cp -R dist/Chess/. dist/staging/Chess/
          fi
          cp -R piece_images dist/staging/Chess/piece_images
          cp fens.txt dist/staging/Chess/fens.txt
          if [[ "${{ matrix.asset }}" != "windows-x64" ]]; then
            printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")"' 'exec ./Chess' > "dist/staging/Chess/${{ matrix.launcher }}"
            chmod +x "dist/staging/Chess/${{ matrix.launcher }}"
          else
            printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'Chess.exe' > "dist/staging/Chess/${{ matrix.launcher }}"
          fi
          cd dist/staging
          python -m zipfile -c "../../Chess-${{ matrix.asset }}.zip" Chess
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-${{ matrix.asset }}
          path: Chess-${{ matrix.asset }}.zip
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: Create draft GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/*.zip
